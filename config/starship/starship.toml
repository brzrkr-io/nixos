"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

# Colors resolve through [palettes.theme], appended per-theme by theme.sh
# (config/themes/<name>/<variant>/starship.toml). Edit THIS file + fragments,
# never the generated starship.toml.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](conflict) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
# tokyonight night — official folke palette; accent=magenta (the old prompt purple)
[palettes.theme]
blue = "#7aa2f7"
red = "#f7768e"
green = "#9ece6a"
cyan = "#7dcfff"
yellow = "#e0af68"
bright-black = "#565f89"
accent = "#bb9af7"
conflict = "#ff9e64"

