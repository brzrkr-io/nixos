# Starship Configuration (base — palette appended by the `theme` CLI into starship.toml)
# Prompt structure only; colors reference [palettes.theme] names

"$schema" = 'https://starship.rs/config-schema.json'

# Palette section comes from the active theme fragment
palette = "theme"

# Prompt format
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Time on the right
right_format = """$time"""

[line_break]
disabled = true

[time]
disabled = false
style = "bold magenta"
format = "[$time]($style)"
time_format = "%H:%M"

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bold magenta"
format = " ([$branch]($style))"

[git_status]
style = "bold red"
format = "[$all_status]($style)"
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "↕"
up_to_date = ""
untracked = "+"
stashed = ""
modified = "*"
staged = ""
renamed = ""
deleted = ""

[character]
success_symbol = " [➜](bold blue)"
error_symbol = " [➜](bold red)"
vimcmd_symbol = " [❮](bold blue)"

# tokyonight light (appended to starship.base.toml by `theme apply`)
[palettes.theme]
bg = "#e1e2e7"
bg_dark = "#d0d5e3"
bg_highlight = "#c4c8da"
terminal_black = "#a1a6c5"
fg = "#3760bf"
fg_dark = "#6172b0"
comment = "#848cb5"
blue = "#2e7de9"
cyan = "#007197"
blue1 = "#188092"
magenta = "#9854f1"
orange = "#b15c00"
yellow = "#8c6c3e"
green = "#587539"
teal = "#118c74"
red = "#f52a65"
