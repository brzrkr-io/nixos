"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

# Colors resolve through [palettes.theme], appended per-theme by theme.sh
# (config/themes/<name>/<variant>/starship.toml). Edit THIS file + fragments,
# never the generated starship.toml.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](conflict) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
# gruvbox dark hard — bright variants (same picks as tmux fragment)
[palettes.theme]
blue = "#83a598"
red = "#fb4934"
green = "#b8bb26"
cyan = "#8ec07c"
yellow = "#fabd2f"
bright-black = "#928374"
accent = "#fe8019"
conflict = "#d3869b"

