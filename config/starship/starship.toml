# Starship Configuration (base — palette appended by the `theme` CLI into starship.toml)
# Prompt structure only; colors reference [palettes.theme] names

"$schema" = 'https://starship.rs/config-schema.json'

# Palette section comes from the active theme fragment
palette = "theme"

# Prompt format
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Time on the right
right_format = """$time"""

[line_break]
disabled = true

[time]
disabled = false
style = "bold magenta"
format = "[$time]($style)"
time_format = "%H:%M"

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bold magenta"
format = " ([$branch]($style))"

[git_status]
style = "bold red"
format = "[$all_status]($style)"
conflicted = "!"
ahead = "↑"
behind = "↓"
diverged = "↕"
up_to_date = ""
untracked = "+"
stashed = ""
modified = "*"
staged = ""
renamed = ""
deleted = ""

[character]
success_symbol = " [➜](bold blue)"
error_symbol = " [➜](bold red)"
vimcmd_symbol = " [❮](bold blue)"

# gruvbox dark hard (appended to starship.base.toml by `theme apply`)
[palettes.theme]
bg = "#1d2021"
bg_dark = "#161819"
bg_highlight = "#3c3836"
terminal_black = "#504945"
fg = "#ebdbb2"
fg_dark = "#d5c4a1"
comment = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
blue1 = "#458588"
magenta = "#d3869b"
orange = "#fe8019"
yellow = "#fabd2f"
green = "#b8bb26"
teal = "#689d6a"
red = "#fb4934"
