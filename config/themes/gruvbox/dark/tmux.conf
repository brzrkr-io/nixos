# gruvbox dark hard
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left "#[fg=#fe8019,bold] #S "
set -g status-right "#[fg=#928374]%H:%M"
setw -g window-status-current-style "fg=#fe8019,bold"
setw -g window-status-style "fg=#928374"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fe8019"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"
