# gruvbox dark hard — morhetz palette in the official tokyonight tmux layout
# (accent=orange, bg=bg0_h #1d2021, raised=bg1 #3c3836, dim=fg4 #a89984)

set -g mode-style "fg=#fe8019,bg=#3c3836"

set -g message-style "fg=#fe8019,bg=#3c3836"
set -g message-command-style "fg=#fe8019,bg=#3c3836"

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fe8019"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#fe8019,bg=#1d2021"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1d2021,bg=#fe8019,bold] #S #[fg=#fe8019,bg=#1d2021,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#3c3836,bg=#1d2021,nobold,nounderscore,noitalics]#[fg=#fe8019,bg=#3c3836] %Y-%m-%d  %H:%M #[fg=#fe8019,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#1d2021,bg=#fe8019,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a89984,bg=#1d2021"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a89984,bg=#1d2021"
setw -g window-status-format "#[default] #I  #W #F "
setw -g window-status-current-format "#[fg=#1d2021,bg=#3c3836,nobold,nounderscore,noitalics]#[fg=#fe8019,bg=#3c3836,bold] #I  #W #F #[fg=#3c3836,bg=#1d2021,nobold,nounderscore,noitalics]"
