# gruvbox dark hard — morhetz palette,
# bar layout cribbed from Sin-cy/dotfiles (centered minimal tabs, transparent)

set -g mode-style "fg=#fe8019,bg=#3c3836"

set -g message-style "fg=#fe8019,bg=#3c3836"
set -g message-command-style "fg=#fe8019,bg=#3c3836"

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fe8019"

# Bar: transparent bg (ghostty opacity shows through), windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#ebdbb2,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session pill: green normally, red while the prefix is armed; [Z] when zoomed
set -g status-left "#[fg=#1d2021,bg=#b8bb26,bold]#{?client_prefix,#[bg=#fb4934],} #S #[default]#{?window_zoomed_flag, #[fg=#fabd2f][Z]#[default],}"
set -g status-right ""

# Windows: minimal "index: name" tabs, active in bold accent
setw -g window-status-separator "#[fg=#504945]│"
setw -g window-status-style "NONE,fg=#928374,bg=default"
setw -g window-status-format " #I: #W "
setw -g window-status-current-style "bold,fg=#fe8019,bg=default"
setw -g window-status-current-format " #I: #W "
setw -g window-status-activity-style "underscore,fg=#fb4934,bg=default"
setw -g window-status-bell-style "bold,fg=#fb4934,bg=default"
