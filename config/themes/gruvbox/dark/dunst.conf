# gruvbox dark hard
[global]
    frame_color = "#504945"

[urgency_low]
    background = "#1d2021"
    foreground = "#ebdbb2"
    frame_color = "#8ec07c"
    highlight = "#8ec07c"

[urgency_normal]
    background = "#1d2021"
    foreground = "#ebdbb2"
    frame_color = "#fe8019"
    highlight = "#fabd2f"

[urgency_critical]
    background = "#1d2021"
    foreground = "#ebdbb2"
    frame_color = "#fb4934"
    highlight = "#fb4934"
