# gruvbox dark hard — morhetz palette, structure mirrors the official
# tokyonight dunst port (fg frames; critical = raised bg + red)
[global]
    frame_color = "#504945"

[urgency_low]
    background = "#1d2021"
    foreground = "#ebdbb2"
    frame_color = "#ebdbb2"

[urgency_normal]
    background = "#282828"
    foreground = "#ebdbb2"
    frame_color = "#ebdbb2"

[urgency_critical]
    background = "#3c3836"
    foreground = "#fb4934"
    frame_color = "#fb4934"
