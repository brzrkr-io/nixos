# gruvbox light hard — morhetz palette,
# bar layout cribbed from Sin-cy/dotfiles (centered minimal tabs, transparent)

set -g mode-style "fg=#af3a03,bg=#d5c4a1"

set -g message-style "fg=#af3a03,bg=#d5c4a1"
set -g message-command-style "fg=#af3a03,bg=#d5c4a1"

set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#af3a03"

# Bar: transparent bg (ghostty opacity shows through), windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#3c3836,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session pill: green normally, red while the prefix is armed; [Z] when zoomed
set -g status-left "#[fg=#f9f5d7,bg=#79740e,bold]#{?client_prefix,#[bg=#9d0006],} #S #[default]#{?window_zoomed_flag, #[fg=#b57614][Z]#[default],}"
set -g status-right ""

# Windows: minimal "index: name" tabs, active in bold accent
setw -g window-status-separator "#[fg=#d5c4a1]│"
setw -g window-status-style "NONE,fg=#7c6f64,bg=default"
setw -g window-status-format " #I: #W "
setw -g window-status-current-style "bold,fg=#af3a03,bg=default"
setw -g window-status-current-format " #I: #W "
setw -g window-status-activity-style "underscore,fg=#9d0006,bg=default"
setw -g window-status-bell-style "bold,fg=#9d0006,bg=default"
