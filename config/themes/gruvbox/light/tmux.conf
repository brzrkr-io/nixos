# gruvbox light hard — morhetz palette in the official tokyonight tmux layout
# (accent=faded orange, bg=bg0_h #f9f5d7, raised=bg2 #d5c4a1, dim=fg4 #7c6f64)

set -g mode-style "fg=#af3a03,bg=#d5c4a1"

set -g message-style "fg=#af3a03,bg=#d5c4a1"
set -g message-command-style "fg=#af3a03,bg=#d5c4a1"

set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#af3a03"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#af3a03,bg=#f9f5d7"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#f9f5d7,bg=#af3a03,bold] #S #[fg=#af3a03,bg=#f9f5d7,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#d5c4a1,bg=#f9f5d7,nobold,nounderscore,noitalics]#[fg=#af3a03,bg=#d5c4a1] %Y-%m-%d  %H:%M #[fg=#af3a03,bg=#d5c4a1,nobold,nounderscore,noitalics]#[fg=#f9f5d7,bg=#af3a03,bold] #h "

setw -g window-status-activity-style "underscore,fg=#7c6f64,bg=#f9f5d7"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#7c6f64,bg=#f9f5d7"
setw -g window-status-format "#[default] #I  #W #F "
setw -g window-status-current-format "#[fg=#f9f5d7,bg=#d5c4a1,nobold,nounderscore,noitalics]#[fg=#af3a03,bg=#d5c4a1,bold] #I  #W #F #[fg=#d5c4a1,bg=#f9f5d7,nobold,nounderscore,noitalics]"
