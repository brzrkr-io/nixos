# gruvbox light hard — Sin-cy/dotfiles bar, faithful port: TRANSPARENT strip
# (bg=default, terminal/blur shows through), bare text tabs with │ separators,
# active tab = solid accent box, session = green text that flips to a solid
# red box while the prefix is armed, load + RAM on the right.
# Icons are nerd-font codepoints (U+F120/F002/F4BC/F035B) — edit with care.

set -g mode-style "fg=#af3a03,bg=#d5c4a1"

set -g message-style "fg=#af3a03,bg=#d5c4a1"
set -g message-command-style "fg=#af3a03,bg=#d5c4a1"

set -g pane-border-style "fg=#d5c4a1"
set -g pane-active-border-style "fg=#af3a03"

# Bar: transparent, windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#3c3836,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session: green text, solid red box while prefix armed; zoom flag after
# (single-attr #[..] runs inside #{?..} — no commas, no #, escapes, tmux
# 3.6-safe; nested #{#[..]} groups expand empty there)
set -g status-left ""
set -ga status-left "#{?client_prefix,#[bg=#9d0006]#[fg=#f9f5d7]#[bold],#[fg=#79740e]}  #S "
set -ga status-left "#[bg=default,fg=#7c6f64,none]#{?window_zoomed_flag, │,}"
set -ga status-left "#[bg=default,fg=#b57614]#{?window_zoomed_flag,  zoom ,}"

# Right: 1-min load + used/total RAM, plain /proc reads every status-interval
set -g status-right "#[bg=default,fg=#b57614] #(cut -d' ' -f1 /proc/loadavg) #[fg=#7c6f64]│ #[fg=#427b58]󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%.1f/%.0fG\", (t-a)/1048576, t/1048576}' /proc/meminfo) "

# Windows: bare " index: name " tabs, │ separators, active = solid accent box
set -g window-status-format " #I: #W "
set -g window-status-style "bg=default,fg=#7c6f64"
set -g window-status-last-style "bg=default,fg=#665c54"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=#af3a03,fg=#f9f5d7,bold"
set -g window-status-activity-style "bg=#9d0006,fg=#f9f5d7"
set -g window-status-bell-style "bg=#9d0006,fg=#f9f5d7,bold"
set -g window-status-separator "#[bg=default,fg=#7c6f64]│"
