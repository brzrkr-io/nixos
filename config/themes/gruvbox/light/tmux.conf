# gruvbox light hard
set -g status-style "bg=#ebdbb2,fg=#3c3836"
set -g status-left "#[fg=#af3a03,bold] #S "
set -g status-right "#[fg=#7c6f64]%H:%M"
setw -g window-status-current-style "fg=#af3a03,bold"
setw -g window-status-style "fg=#7c6f64"
set -g pane-border-style "fg=#bdae93"
set -g pane-active-border-style "fg=#af3a03"
set -g message-style "bg=#d5c4a1,fg=#3c3836"
setw -g mode-style "bg=#bdae93,fg=#3c3836"
