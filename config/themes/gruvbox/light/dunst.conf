# gruvbox light hard — morhetz palette, structure mirrors the official
# tokyonight dunst port
[global]
    frame_color = "#bdae93"

[urgency_low]
    background = "#fbf1c7"
    foreground = "#3c3836"
    frame_color = "#3c3836"

[urgency_normal]
    background = "#f9f5d7"
    foreground = "#3c3836"
    frame_color = "#3c3836"

[urgency_critical]
    background = "#ebdbb2"
    foreground = "#9d0006"
    frame_color = "#9d0006"
