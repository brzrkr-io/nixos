# gruvbox light hard
[global]
    frame_color = "#bdae93"

[urgency_low]
    background = "#f9f5d7"
    foreground = "#3c3836"
    frame_color = "#427b58"
    highlight = "#427b58"

[urgency_normal]
    background = "#f9f5d7"
    foreground = "#3c3836"
    frame_color = "#af3a03"
    highlight = "#b57614"

[urgency_critical]
    background = "#f9f5d7"
    foreground = "#3c3836"
    frame_color = "#9d0006"
    highlight = "#9d0006"
