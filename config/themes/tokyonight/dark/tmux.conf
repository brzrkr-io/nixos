# tokyonight dark
set -g status-style "bg=#16161e,fg=#c0caf5"
set -g status-left "#[fg=#7aa2f7,bold] #S "
set -g status-right "#[fg=#565f89]%H:%M"
setw -g window-status-current-style "fg=#7aa2f7,bold"
setw -g window-status-style "fg=#565f89"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
setw -g mode-style "bg=#33467c,fg=#c0caf5"
