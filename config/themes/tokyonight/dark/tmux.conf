# tokyonight night — Sin-cy/dotfiles bar, faithful port: TRANSPARENT strip
# (bg=default, terminal/blur shows through), bare text tabs with │ separators,
# active tab = solid accent box, session = green text that flips to a solid
# red box while the prefix is armed, load + RAM on the right.
# Icons are nerd-font codepoints (U+F120/F002/F4BC/F035B) — edit with care.

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Bar: transparent, windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#a9b1d6,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session: green text, solid red box while prefix armed; zoom flag after
# (single-attr #[..] runs inside #{?..} — no commas, no #, escapes, tmux
# 3.6-safe; nested #{#[..]} groups expand empty there)
set -g status-left ""
set -ga status-left "#{?client_prefix,#[bg=#f7768e]#[fg=#1a1b26]#[bold],#[fg=#9ece6a]}  #S "
set -ga status-left "#[bg=default,fg=#565f89,none]#{?window_zoomed_flag, │,}"
set -ga status-left "#[bg=default,fg=#e0af68]#{?window_zoomed_flag,  zoom ,}"

# Right: 1-min load + used/total RAM, plain /proc reads every status-interval
set -g status-right "#[bg=default,fg=#e0af68] #(cut -d' ' -f1 /proc/loadavg) #[fg=#565f89]│ #[fg=#7dcfff]󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%.1f/%.0fG\", (t-a)/1048576, t/1048576}' /proc/meminfo) "

# Windows: bare " index: name " tabs, │ separators, active = solid accent box
set -g window-status-format " #I: #W "
set -g window-status-style "bg=default,fg=#565f89"
set -g window-status-last-style "bg=default,fg=#737aa2"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g window-status-activity-style "bg=#f7768e,fg=#1a1b26"
set -g window-status-bell-style "bg=#f7768e,fg=#1a1b26,bold"
set -g window-status-separator "#[bg=default,fg=#565f89]│"
