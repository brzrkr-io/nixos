# tokyonight night — official folke/tokyonight.nvim palette,
# bar layout cribbed from Sin-cy/dotfiles (centered minimal tabs, transparent)

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Bar: transparent bg (ghostty opacity shows through), windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#a9b1d6,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session pill: green normally, red while the prefix is armed; [Z] when zoomed
set -g status-left "#[fg=#15161e,bg=#9ece6a,bold]#{?client_prefix,#[bg=#f7768e],} #S #[default]#{?window_zoomed_flag, #[fg=#e0af68][Z]#[default],}"
set -g status-right ""

# Windows: minimal "index: name" tabs, active in bold accent
setw -g window-status-separator "#[fg=#3b4261]│"
setw -g window-status-style "NONE,fg=#565f89,bg=default"
setw -g window-status-format " #I: #W "
setw -g window-status-current-style "bold,fg=#7aa2f7,bg=default"
setw -g window-status-current-format " #I: #W "
setw -g window-status-activity-style "underscore,fg=#f7768e,bg=default"
setw -g window-status-bell-style "bold,fg=#f7768e,bg=default"
