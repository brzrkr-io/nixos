# tokyonight dark
[global]
    frame_color = "#414868"

[urgency_low]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#7dcfff"
    highlight = "#73daca"

[urgency_normal]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#bb9af7"
    highlight = "#7aa2f7"

[urgency_critical]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#f7768e"
    highlight = "#f7768e"
