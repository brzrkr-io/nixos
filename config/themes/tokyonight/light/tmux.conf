# tokyonight light (day)
set -g status-style "bg=#d0d5e3,fg=#3760bf"
set -g status-left "#[fg=#2e7de9,bold] #S "
set -g status-right "#[fg=#848cb5]%H:%M"
setw -g window-status-current-style "fg=#2e7de9,bold"
setw -g window-status-style "fg=#848cb5"
set -g pane-border-style "fg=#a1a6c5"
set -g pane-active-border-style "fg=#2e7de9"
set -g message-style "bg=#c4c8da,fg=#3760bf"
setw -g mode-style "bg=#b6bfe2,fg=#3760bf"
