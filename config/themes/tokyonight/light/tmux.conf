# tokyonight day — bar layout matching Sin-cy/dotfiles: solid strip, square
# boxes, centered tabs, session box turns red while the prefix is armed,
# load + RAM on the right. GENERATED look, hand-tuned colors.
# Icons are nerd-font codepoints (U+F120/F002/F4BC/F035B) — edit with care.

set -g mode-style "fg=#2e7de9,bg=#a8aecb"

set -g message-style "fg=#2e7de9,bg=#a8aecb"
set -g message-command-style "fg=#2e7de9,bg=#a8aecb"

set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#2e7de9"

# Bar: solid strip on theme bg, windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#3760bf,bg=#e1e2e7"
set -g status-left-length 100
set -g status-right-length 100

# Session box: green, red while prefix armed; zoom flag after
# (nested #{#[..]} groups expand empty on tmux 3.6 — use #, escapes)
set -g status-left ""
set -ga status-left "#[fg=#e1e2e7,bold]#{?client_prefix,#[bg=#f52a65],#[bg=#587539]}  #S "
set -ga status-left "#[bg=#e1e2e7,fg=#848cb5,none]#{?window_zoomed_flag, │,}"
set -ga status-left "#[bg=#e1e2e7,fg=#8c6c3e]#{?window_zoomed_flag,  zoom ,}"

# Right: 1-min load + used/total RAM, plain /proc reads every status-interval
set -g status-right "#[bg=#e1e2e7,fg=#8c6c3e] #(cut -d' ' -f1 /proc/loadavg) #[fg=#848cb5]│ #[fg=#007197]󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%.1f/%.0fG\", (t-a)/1048576, t/1048576}' /proc/meminfo) "

# Windows: plain " index: name " tabs, │ separators, active = solid accent box
set -g window-status-format " #I: #W "
set -g window-status-style "bg=#e1e2e7,fg=#848cb5"
set -g window-status-last-style "bg=#e1e2e7,fg=#6172b0"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=#2e7de9,fg=#e1e2e7,bold"
set -g window-status-activity-style "bg=#f52a65,fg=#e1e2e7"
set -g window-status-bell-style "bg=#f52a65,fg=#e1e2e7,bold"
set -g window-status-separator "#[bg=#e1e2e7,fg=#848cb5]│"
