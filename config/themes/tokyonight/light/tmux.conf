# tokyonight day — official folke/tokyonight.nvim palette,
# bar layout cribbed from Sin-cy/dotfiles (centered minimal tabs, transparent)

set -g mode-style "fg=#2e7de9,bg=#a8aecb"

set -g message-style "fg=#2e7de9,bg=#a8aecb"
set -g message-command-style "fg=#2e7de9,bg=#a8aecb"

set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#2e7de9"

# Bar: transparent bg (ghostty opacity shows through), windows centered
set -g status "on"
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#3760bf,bg=default"
set -g status-left-length 100
set -g status-right-length 100

# Session pill: green normally, red while the prefix is armed; [Z] when zoomed
set -g status-left "#[fg=#e1e2e7,bg=#587539,bold]#{?client_prefix,#[bg=#f52a65],} #S #[default]#{?window_zoomed_flag, #[fg=#8c6c3e][Z]#[default],}"
set -g status-right ""

# Windows: minimal "index: name" tabs, active in bold accent
setw -g window-status-separator "#[fg=#a8aecb]│"
setw -g window-status-style "NONE,fg=#848cb5,bg=default"
setw -g window-status-format " #I: #W "
setw -g window-status-current-style "bold,fg=#2e7de9,bg=default"
setw -g window-status-current-format " #I: #W "
setw -g window-status-activity-style "underscore,fg=#f52a65,bg=default"
setw -g window-status-bell-style "bold,fg=#f52a65,bg=default"
