# tokyonight light (day)
[global]
    frame_color = "#a1a6c5"

[urgency_low]
    background = "#e1e2e7"
    foreground = "#3760bf"
    frame_color = "#007197"
    highlight = "#118c74"

[urgency_normal]
    background = "#e1e2e7"
    foreground = "#3760bf"
    frame_color = "#9854f1"
    highlight = "#2e7de9"

[urgency_critical]
    background = "#e1e2e7"
    foreground = "#3760bf"
    frame_color = "#f52a65"
    highlight = "#f52a65"
