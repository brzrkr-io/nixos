# Rose Pine — transparent status strip
set -g mode-style "fg=#ebbcba,bg=#403d52"
set -g message-style "fg=#ebbcba,bg=#403d52"
set -g message-command-style "fg=#ebbcba,bg=#403d52"
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#ebbcba"
set -g status on
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#908caa,bg=default"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#9ccfd8]  #S #[fg=#6e6a86]│"
set -g status-right "#[fg=#f6c177] #(cut -d' ' -f1 /proc/loadavg) #[fg=#6e6a86]│ #[fg=#9ccfd8]󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%.1f/%.0fG\", (t-a)/1048576, t/1048576}' /proc/meminfo) "
set -g window-status-format " #I: #W "
set -g window-status-style "bg=default,fg=#6e6a86"
set -g window-status-last-style "bg=default,fg=#908caa"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=#ebbcba,fg=#191724,bold"
set -g window-status-activity-style "bg=#eb6f92,fg=#191724"
set -g window-status-bell-style "bg=#eb6f92,fg=#191724,bold"
set -g window-status-separator "#[bg=default,fg=#6e6a86]│"
