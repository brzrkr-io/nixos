# Rose Pine Dawn — transparent status strip
set -g mode-style "fg=#d7827e,bg=#dfdad9"
set -g message-style "fg=#d7827e,bg=#dfdad9"
set -g message-command-style "fg=#d7827e,bg=#dfdad9"
set -g pane-border-style "fg=#dfdad9"
set -g pane-active-border-style "fg=#d7827e"
set -g status on
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=#797593,bg=default"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#56949f]  #S #[fg=#9893a5]│"
set -g status-right "#[fg=#ea9d34] #(cut -d' ' -f1 /proc/loadavg) #[fg=#9893a5]│ #[fg=#56949f]󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf \"%.1f/%.0fG\", (t-a)/1048576, t/1048576}' /proc/meminfo) "
set -g window-status-format " #I: #W "
set -g window-status-style "bg=default,fg=#9893a5"
set -g window-status-last-style "bg=default,fg=#797593"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=#d7827e,fg=#faf4ed,bold"
set -g window-status-activity-style "bg=#b4637a,fg=#faf4ed"
set -g window-status-bell-style "bg=#b4637a,fg=#faf4ed,bold"
set -g window-status-separator "#[bg=default,fg=#9893a5]│"
