# ============================================================================
# HYPRLOCK CONFIGURATION
# Lock screen with Tokyo Night theme
# ============================================================================

# ============================================================================
# BACKGROUND
# ============================================================================
background {
    monitor =
    path = ~/dotfiles/wallpapers/linux_retro.png
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ============================================================================
# INPUT FIELD
# ============================================================================
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(414868ee)
    inner_color = rgba(292e42ee)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    fade_timeout = 1000

    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 8

    check_color = rgba(73dacaff)
    fail_color = rgba(f7768eff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    capslock_color = rgba(e0af68ff)
    numlock_color = -1
    bothlock_color = -1

    position = 0, -80
    halign = center
    valign = center
}

# ============================================================================
# TIME
# ============================================================================
label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 200
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(1a1b2680)
}

# ============================================================================
# DATE
# ============================================================================
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(565f89ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 120
    halign = center
    valign = center
}

# ============================================================================
# GREETING
# ============================================================================
label {
    monitor =
    text = Welcome, $USER
    color = rgba(7aa2f7ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -20
    halign = center
    valign = center
}

# ============================================================================
# KEYBOARD LAYOUT (if using multiple)
# ============================================================================
label {
    monitor =
    text = $LAYOUT
    color = rgba(565f89ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -140
    halign = center
    valign = center
}
