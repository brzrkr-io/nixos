# ============================================================================
# HYPRLOCK CONFIGURATION
# Colors + wallpaper come from the active theme (see config/themes/)
# ============================================================================

source = ~/.config/theme/current/hyprlock.conf

# ============================================================================
# BACKGROUND
# ============================================================================
background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ============================================================================
# INPUT FIELD
# ============================================================================
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = $outer
    inner_color = $inner
    font_color = $font
    fade_on_empty = false
    fade_timeout = 1000

    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 8

    check_color = $check
    fail_color = $fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    capslock_color = $warn
    numlock_color = -1
    bothlock_color = -1

    position = 0, -80
    halign = center
    valign = center
}

# ============================================================================
# TIME
# ============================================================================
label {
    monitor =
    text = $TIME
    color = $font
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 200
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
}

# ============================================================================
# DATE
# ============================================================================
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = $dim
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 120
    halign = center
    valign = center
}

# ============================================================================
# GREETING
# ============================================================================
label {
    monitor =
    text = Welcome, $USER
    color = $accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -20
    halign = center
    valign = center
}

# ============================================================================
# KEYBOARD LAYOUT (if using multiple)
# ============================================================================
label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, -140
    halign = center
    valign = center
}
