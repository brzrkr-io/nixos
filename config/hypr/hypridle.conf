# ============================================================================
# HYPRIDLE CONFIGURATION
# Idle management and screen timeout
# ============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ============================================================================
# TIMEOUT: DIM SCREEN (5 minutes)
# ============================================================================
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# ============================================================================
# TIMEOUT: LOCK SCREEN (10 minutes)
# ============================================================================
listener {
    timeout = 600
    on-timeout = hyprlock
}

# ============================================================================
# TIMEOUT: DPMS OFF (12 minutes)
# ============================================================================
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ============================================================================
# TIMEOUT: SUSPEND (30 minutes) - DISABLED for desktop
# Uncomment if you want auto-suspend
# ============================================================================
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
