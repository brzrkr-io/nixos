# Tmux Base Configuration
# This file contains your personal settings and will not be overwritten by the theme manager.

# ===========================
# GENERAL SETTINGS
# ===========================
# tmux-256color (not legacy screen-256color) so programs inside tmux get
# full terminfo; RGB override advertises 24-bit color for ghostty's TERM
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:RGB,xterm-ghostty:RGB"
# Pass clickable links (OSC 8 hyperlinks) through to ghostty.
set -as terminal-features ",xterm-ghostty:hyperlinks,xterm*:hyperlinks"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# ===========================
# KEY BINDINGS
# ===========================
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===========================
# THEME (Loaded from external file)
# ===========================
# Load the theme before the plugins so continuum can hook status-right.
# -q: don't error before the first `theme apply` creates the symlink.
source-file -q ~/.config/theme/current/tmux.conf

# ===========================
# PLUGINS (nix-managed, no TPM)
# ===========================
# Delivered by home-manager to a stable path (home/default.nix); adding a
# plugin means editing both places. Options first, then run-shells;
# resurrect must load before continuum.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell ~/.local/share/tmux-plugins/sensible/sensible.tmux
run-shell ~/.local/share/tmux-plugins/resurrect/resurrect.tmux
run-shell ~/.local/share/tmux-plugins/continuum/continuum.tmux
run-shell ~/.local/share/tmux-plugins/yank/yank.tmux