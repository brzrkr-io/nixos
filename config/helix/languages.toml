# Language-specific tweaks. Helix ships sane defaults for every language
# below — this file only overrides where the defaults need help.
# Servers on PATH: gopls, rust-analyzer, pyright, typescript-language-server,
# nil, bash-language-server, terraform-ls, yaml-language-server, lua-language-server.

[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixpkgs-fmt" }

[[language]]
name = "go"
auto-format = true   # gopls formats + organizes imports on save

[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer.config]
check.command = "clippy"   # clippy lints on save instead of plain check

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }
