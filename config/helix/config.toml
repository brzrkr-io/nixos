# Helix — on trial as nvim replacement. Everything IDE-ish is built in;
# language servers come from the system config (modules/desktop.nix).
# Learn the model: `hx --tutor` (~20 min). Cheat: SPACE opens the command palette.

theme = "noctalia"

[editor]
line-number = "relative"
cursorline = true
true-color = true
color-modes = true          # mode shown by cursor-line color, mac-subtle
bufferline = "multiple"     # show open buffers as tabs when >1
rulers = [100]
idle-timeout = 50           # snappier completion popup

[editor.cursor-shape]
insert = "bar"              # mac-familiar: thin bar in insert mode
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true     # LSP progress in the statusline
display-inlay-hints = true  # types/params inline (rust shines here)

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "version-control", "position", "file-type"]

[editor.file-picker]
hidden = false              # show dotfiles in the SPACE-f picker (you edit configs a lot)

[editor.indent-guides]
render = true
character = "▏"

[editor.soft-wrap]
enable = false

[keys.normal]
# Muscle-memory bridges from your nvim setup
"C-s" = ":write"            # you kept <leader>w in nvim; Ctrl+S here
"esc" = ["collapse_selection", "keep_primary_selection"]
